name: Payment Request Cron Job

on:
  schedule:
    # 매일 자정 (UTC 기준)에 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행도 가능

jobs:
  request-payments:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Request payments via Supabase Edge Function
      run: |
        # Supabase Edge Function 호출
        SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
        SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
        
        # Edge Function URL 구성
        EDGE_FUNCTION_URL="${SUPABASE_URL}/functions/v1/request-payment"
        
        echo "Calling payment request Edge Function..."
        
        # Edge Function 호출
        response=$(curl -X POST \
          -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
          -H "Content-Type: application/json" \
          "$EDGE_FUNCTION_URL")
        
        echo "Response: $response"
        
        # 응답 확인
        if echo "$response" | grep -q '"success":true'; then
          echo "✅ Payment requests processed successfully"
          exit 0
        else
          echo "❌ Payment request processing failed"
          exit 1
        fi

    - name: Notify on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number
          });
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: '❌ Payment request cron job failed. Please check the logs.'
          });
